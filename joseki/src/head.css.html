<title>定跡なぞり</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* Layout: 一覧は定跡カードの一列．対局画面は盤を主役に，右（狭い画面では下）に棋譜と解説． */
:root {
  --bg: #eceee8;
  --surface: #f7f8f4;
  --ink: #1f1c16;
  --muted: #6b6558;
  --line: rgba(31, 28, 22, 0.14);
  --board: #e2b768;
  --grid: #5b3f1b;
  --piece: #f4e2b8;
  --piece-edge: #a77f3f;
  --accent: #b8402b;
  --good: #2f7a4a;
  --hl: rgba(184, 64, 43, 0.22);
  --last: rgba(47, 122, 74, 0.22);
  --sign: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --ui: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161915; --surface: #1f231e; --ink: #e7e9e3; --muted: #a29d8f; --line: rgba(231, 233, 227, 0.14);
    --board: #b98b47; --grid: #3d2a10; --piece: #ead6a6; --piece-edge: #8a6530;
    --accent: #ec6b52; --good: #5cb97c; --hl: rgba(236, 107, 82, 0.32); --last: rgba(92, 185, 124, 0.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161915; --surface: #1f231e; --ink: #e7e9e3; --muted: #a29d8f; --line: rgba(231, 233, 227, 0.14);
  --board: #b98b47; --grid: #3d2a10; --piece: #ead6a6; --piece-edge: #8a6530;
  --accent: #ec6b52; --good: #5cb97c; --hl: rgba(236, 107, 82, 0.32); --last: rgba(92, 185, 124, 0.3);
  color-scheme: dark;
}
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--ui); }
.wrap {
  max-width: 980px; margin: 0 auto;
  padding-block: 24px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 20px;
}
h1, h2 { font-family: var(--sign); font-weight: 800; margin: 0; line-height: 1.2; text-wrap: balance; }
h1 { font-size: clamp(30px, 7vw, 42px); }
h2 { font-size: 24px; }
p { margin: 0; line-height: 1.8; }
.lead { color: var(--muted); max-width: 40em; }
.eyebrow { font-size: 11px; letter-spacing: 0.2em; color: var(--muted); }

/* 一覧 */
.list { display: grid; gap: 10px; }
.item {
  display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center;
  text-align: left; font: inherit; color: inherit;
  background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
  padding: 14px 16px; cursor: pointer;
}
.item:hover { border-color: var(--ink); }
.item .mark {
  font-family: var(--sign); font-weight: 800; font-size: 22px;
  width: 46px; height: 50px; display: grid; place-items: center;
  background: var(--piece); color: #1f1c16; border: 1px solid var(--piece-edge);
  clip-path: polygon(50% 0, 86% 16%, 100% 100%, 0 100%, 14% 16%);
}
.item .body { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.item .name { font-family: var(--sign); font-weight: 800; font-size: 19px; }
.item .meta { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 10px; }
.item .desc { font-size: 13px; line-height: 1.6; }
.stars { font-size: 16px; letter-spacing: 2px; color: var(--accent); white-space: nowrap; }
.stars .off { color: var(--line); }

/* 対局画面 */
.play { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 24px; align-items: start; }
@media (max-width: 760px) { .play { grid-template-columns: 1fr; } }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.back {
  font: 700 13px var(--ui); color: var(--ink); background: transparent;
  border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer;
}
.boardcol { display: flex; flex-direction: column; gap: 8px; align-items: center; min-width: 0; }
.hand {
  width: min(100%, 520px); min-height: 34px;
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  font-size: 13px; color: var(--muted);
}
.hand b { font-family: var(--sign); font-size: 18px; color: var(--ink); }
.boardbox { width: min(100%, 520px); display: grid; grid-template-columns: 1fr 18px; gap: 4px; }
.files { display: grid; grid-template-columns: repeat(9, 1fr); font-size: 11px; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; }
.ranks { display: grid; grid-template-rows: repeat(9, 1fr); font-family: var(--sign); font-size: 12px; color: var(--muted); align-items: center; text-align: center; }
.board {
  display: grid; grid-template-columns: repeat(9, 1fr);
  background: var(--board); border: 2px solid var(--grid);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
}
.sq {
  aspect-ratio: 1 / 1.1; position: relative; padding: 0; margin: 0;
  border: 0; border-right: 1px solid var(--grid); border-bottom: 1px solid var(--grid);
  background: transparent; cursor: pointer; display: grid; place-items: center; min-width: 0;
}
.sq:nth-child(9n) { border-right: 0; }
.sq:nth-last-child(-n+9) { border-bottom: 0; }
.sq.last { background: var(--last); }
.sq.sel { background: var(--hl); }
.sq.hint::after {
  content: ""; position: absolute; inset: 3px; border: 2px dashed var(--accent); border-radius: 3px;
  animation: blink 1s steps(2) infinite;
}
.sq.wrong { animation: shake .3s; }
.sq:focus-visible { outline: 2px solid var(--ink); outline-offset: -3px; z-index: 1; }
@keyframes blink { 50% { opacity: 0.3; } }
@keyframes shake { 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
.pc {
  width: 84%; height: 90%;
  display: grid; place-items: center;
  background: var(--piece); color: #1f1c16;
  clip-path: polygon(50% 0, 86% 15%, 100% 100%, 0 100%, 14% 15%);
  font-family: var(--sign); font-weight: 800;
  font-size: clamp(14px, 4.4vw, 26px); line-height: 1;
  padding-top: 10%;
  box-shadow: inset 0 -2px 0 var(--piece-edge);
  pointer-events: none;
}
.pc.opp { transform: rotate(180deg); }
.pc.promo { color: #b8402b; }
.pc.long { font-size: clamp(10px, 3vw, 17px); writing-mode: vertical-rl; }

.side { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.prompt { font-weight: 700; font-size: 15px; }
.prompt.ok { color: var(--good); }
.prompt.ng { color: var(--accent); }
.comment { font-size: 14px; line-height: 1.8; min-height: 3.6em; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn {
  font: 700 14px var(--ui); color: var(--bg); background: var(--ink);
  border: 0; border-radius: 4px; padding: 10px 14px; cursor: pointer;
}
.btn.ghost { color: var(--ink); background: transparent; border: 1px solid var(--line); }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn:focus-visible, .back:focus-visible, .item:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.kifu { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(2, 1fr); gap: 2px 10px; font-size: 14px; font-variant-numeric: tabular-nums; max-height: 260px; overflow-y: auto; }
.kifu li { display: flex; gap: 6px; padding: 2px 4px; border-radius: 3px; }
.kifu li .no { color: var(--muted); font-size: 11px; width: 1.8em; text-align: right; padding-top: 3px; }
.kifu li.now { background: var(--hl); }
.kifu li.todo { color: var(--muted); }
.progress { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.progress span { display: block; height: 100%; background: var(--good); transition: width .3s; }
.done { text-align: center; gap: 12px; }
.done .stars { font-size: 30px; }
@media (prefers-reduced-motion: reduce) { .sq.hint::after, .sq.wrong { animation: none; } .progress span { transition: none; } }
